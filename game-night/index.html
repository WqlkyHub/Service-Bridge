<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Manette d'Or" />
<script>
  if ('serviceWorker' in navigator && !window.claude) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('./service-worker.js').catch(function(){}); });
  }
</script>
<!--ARTIFACT-START-->
<title>La Manette d'Or</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23121214'/%3E%3Ccircle cx='32' cy='27' r='8' fill='%23d9f23c'/%3E%3Cpath d='M21 42h22' stroke='%23d9f23c' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f1f1f3; --surface-3:#e9e9ec;
  --line:#e5e5ea; --line-2:#d4d4db;
  --text:#121214; --text-2:#55555f; --text-3:#6e6e7a;
  --accent:#d9f23c; --accent-2:#c3dc26; --on-accent:#191d05;
  --inv-bg:#121214; --inv-text:#fafafa;
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100;
  --c4:#e87ba4; --c5:#008300; --c6:#4a3aa7; --c7:#e34948;
  --shadow:0 1px 2px rgba(18,18,20,.05),0 12px 32px rgba(18,18,20,.08);
  --r:14px; --r-sm:9px;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e11; --surface:#17171b; --surface-2:#1e1e23; --surface-3:#26262d;
    --line:#26262d; --line-2:#35353e;
    --text:#f3f3f5; --text-2:#a8a8b4; --text-3:#8b8b97;
    --accent:#cfee2e; --accent-2:#b9d81c; --on-accent:#15180a;
    --inv-bg:#f3f3f5; --inv-text:#121214;
    --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500;
    --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e11; --surface:#17171b; --surface-2:#1e1e23; --surface-3:#26262d;
  --line:#26262d; --line-2:#35353e;
  --text:#f3f3f5; --text-2:#a8a8b4; --text-3:#8b8b97;
  --accent:#cfee2e; --accent-2:#b9d81c; --on-accent:#15180a;
  --inv-bg:#f3f3f5; --inv-text:#121214;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500;
  --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.022em;text-wrap:balance}
h1{font-size:27px;letter-spacing:-.035em;line-height:1.06}
h2{font-size:17px}
h3{font-size:15.5px;font-weight:600;letter-spacing:-.012em}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.ic{width:17px;height:17px;flex:0 0 auto;display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent);color:var(--on-accent)}

.app{max-width:760px;margin:0 auto;padding-inline:18px}
header.hd{padding-block:20px 0}
.hdTop{display:flex;align-items:flex-start;gap:14px}
.hdTop>div:first-child{flex:1;min-width:0}
.hdActions{display:flex;gap:7px;align-items:center;flex:0 0 auto}
.who{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 7px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;max-width:170px}
.who span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:38px;height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text-2)}
.ib:hover{color:var(--text)}
.ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:0;
  background:var(--surface-3);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line)}
.ava.sm{width:21px;height:21px;font-size:9px}
.ava.lg{width:40px;height:40px;font-size:14px}
.ava.on{background:var(--inv-bg);color:var(--inv-text);box-shadow:none}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px}
.kpi{background:var(--surface);padding:11px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:-.04em}
.kpi span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-family:var(--mono)}
.statusLine{display:flex;align-items:center;gap:7px;padding:11px 2px 0;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.statusLine i{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
.statusLine.on i{background:var(--accent-2)}
.statusLine button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--text-2);text-decoration:underline;text-underline-offset:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-3);font-size:11.5px;font-weight:500;border-radius:10px;position:relative}
nav.tabs button b{font-family:var(--mono);font-size:10px;font-weight:400;opacity:.7}
nav.tabs button[aria-selected="true"]{color:var(--text)}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;top:2px;width:20px;height:2.5px;border-radius:2px;background:var(--accent-2)}
@media(min-width:720px){
  body{padding-bottom:40px}
  nav.tabs{position:static;display:flex;gap:4px;background:none;border:0;padding:18px 0 4px;
    border-bottom:1px solid var(--line);margin-bottom:4px}
  nav.tabs button{min-height:40px;flex-direction:row;gap:7px;padding:0 14px;font-size:14px;border-radius:0}
  nav.tabs button[aria-selected="true"]::after{top:auto;bottom:-5px;width:100%;height:2px;border-radius:0}
}
.view{display:none}
.view.on{display:block}

/* head de section */
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 2px 12px}
.shead h2{font-size:18px}
.shead .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

/* boutons */
.btn{min-height:40px;padding:0 15px;border-radius:10px;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--text-3)}
.btn.pri{background:var(--inv-bg);color:var(--inv-text);border-color:var(--inv-bg)}
.btn.acc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.qt{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.gh{border-color:transparent;background:none;color:var(--text-2)}
.btn.gh:hover{background:var(--surface-2);border-color:transparent}
.btn.dg{color:#c0392b;border-color:rgba(192,57,43,.3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.full{width:100%}

/* filtres */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.baremeBar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;
  padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  font-size:13px;color:var(--text-2)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:0 12px;margin-bottom:10px;color:var(--text-3)}
.search input{flex:1;min-width:0;height:42px;border:0;background:none;padding:0;outline:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.fc{white-space:nowrap;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.fc[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-text);border-color:var(--inv-bg)}
.fc[data-fc][aria-pressed="true"]{background:var(--surface-2);color:var(--text);border-color:var(--text);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--text-3));flex:0 0 auto;display:block}

/* liste de défis */
.group{margin-bottom:26px}
.grpH{display:flex;align-items:center;gap:8px;padding:0 2px 9px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.grpH .gcount{margin-left:auto;color:var(--text-3)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:13px;padding:14px 15px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.row .tl{display:flex;align-items:baseline;gap:8px}
.row h3{overflow-wrap:anywhere}
.row .obj{font-family:var(--mono);font-size:11px;color:var(--text-3);white-space:nowrap}
.row .note{font-size:13px;color:var(--text-2)}
.track{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:2px}
.track i{display:block;height:100%;background:var(--text);border-radius:2px;transition:width .3s ease}
.row.done .track i{background:var(--accent-2)}
.under{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.under .ppl{display:flex;gap:3px;margin-left:auto}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
.row .pts{font-family:var(--mono);font-size:15px;letter-spacing:-.03em;color:var(--text)}
.row .pts em{font-style:normal;font-size:10px;color:var(--text-3);margin-left:2px}
.row .pts .todo{color:var(--text-3);font-weight:400}
.row.done h3{color:var(--text-2)}
.row .sideBtns{display:flex;gap:5px}
.addBtn{width:36px;height:36px;border-radius:9px;background:var(--inv-bg);color:var(--inv-text);display:grid;place-items:center}
.row.done .addBtn{background:none;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.lblRow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lnk{font-size:12.5px;color:var(--text-2);text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--text)}
.dRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dRow:first-of-type{border-top:0}
.dRow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dRow .v{font-family:var(--mono);font-size:16px;min-width:52px;text-align:right}
.dRow .u{font-size:12px;color:var(--text-3);min-width:40px}
.pTot{display:flex;align-items:center;gap:7px;padding:9px 0;border-top:1px solid var(--line)}
.pTot:first-of-type{border-top:0}
.pTot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;color:var(--text-2)}
.pTot.has .nm{color:var(--text);font-weight:500}
.pTot .ptIn{width:76px;flex:0 0 auto;text-align:center;font-size:17px;font-weight:500;padding:8px 4px;min-height:44px}
.pTot .ptIn::-webkit-outer-spin-button,.pTot .ptIn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pTot .ptIn[type=number]{-moz-appearance:textfield}
.stepBtn{flex:0 0 auto}
.eRow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:11px 0;border-top:1px solid var(--line)}
.eRow:first-of-type{border-top:0}
.whoBtn{display:flex;align-items:center;gap:8px;flex:1 1 150px;min-width:0;text-align:left;padding:4px 0}
.whoBtn .nm{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.whoBtn .tiny{flex:0 0 auto}
.eCtl{display:flex;align-items:center;gap:8px;margin-left:auto}
.eCtl .v{font-family:var(--mono);font-size:16px;min-width:46px;text-align:right}
.eCtl .u{font-size:12px;color:var(--text-3)}
.btn.gh.dg{border-color:transparent}
.stepBtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;font-size:17px;line-height:1;color:var(--text)}
.stepBtn:active{background:var(--surface-2)}
.shared{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border-radius:10px;
  padding:11px 12px;font-size:13px;color:var(--text-2);line-height:1.4}
.shared svg{margin-top:2px;color:var(--text-3)}
.shared b{font-weight:500;color:var(--text)}
.tick{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-2);background:var(--accent);padding:2px 7px;border-radius:5px}
:root[data-theme="dark"] .tick,:root:not([data-theme="light"]) .tick{color:var(--on-accent)}

/* joueurs */
.prow{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:13px 15px;border-top:1px solid var(--line)}
.pTop{display:flex;align-items:center;gap:12px}
.prow:first-child{border-top:0}
.prow .nm{font-weight:500}
.prow .sub{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.prow .sc{margin-left:auto;font-family:var(--mono);font-size:16px;letter-spacing:-.03em}

/* classement */
.rk{display:flex;align-items:center;gap:13px;padding:13px 15px;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .pos{font-family:var(--mono);font-size:12px;color:var(--text-3);width:16px}
.rk .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rk .bar{height:4px;border-radius:2px;background:var(--text-3);display:block}
.rk.lead .bar{background:var(--accent-2)}
.rk.lead .pos{color:var(--text)}
.rk .sc{font-family:var(--mono);font-size:16px;letter-spacing:-.03em}

/* stats */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.cat{padding:14px 15px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.cat .ch .tot{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.br{display:grid;grid-template-columns:78px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px;margin-top:7px}
.br .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.br .tr{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.br .fl{display:block;height:100%;border-radius:4px;background:var(--c,var(--text))}
.br .vl{font-family:var(--mono);text-align:right;font-size:12px}
.stack{display:flex;gap:2px;height:10px;border-radius:4px;overflow:hidden}
.stack i{display:block;height:100%;background:var(--c)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);padding-bottom:12px;border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ev{display:flex;align-items:center;gap:11px;padding:11px 15px;border-top:1px solid var(--line);font-size:13.5px}
.ev:first-child{border-top:0}
.ev .t{flex:1;min-width:0}
.ev .t b{font-weight:500}
.ev .t span{display:block;color:var(--text-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .p{font-family:var(--mono);font-size:13px}
.ev .p.neg{color:#c0392b}
.ev .tm{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* vide */
.empty{text-align:center;padding:34px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty h2{margin-bottom:8px}
.empty p{color:var(--text-2);font-size:14px;max-width:44ch;margin:0 auto 16px}
.packs{display:grid;gap:8px;margin-top:12px}
.pack{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);width:100%}
.pack:hover{border-color:var(--text-3)}
.pack .t{flex:1;min-width:0}
.pack .t b{display:block;font-weight:500;font-size:14px}
.pack .t span{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* formulaires */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.inp{width:100%;min-height:44px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px}
.inp:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px var(--surface-3)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:12.5px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.stack-form{display:flex;flex-direction:column;gap:13px}

/* feuille */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(18,18,20,.4);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:var(--bg);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;animation:rise .2s cubic-bezier(.2,.8,.3,1)}
@media(min-width:720px){.scrim{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid var(--line)}}
@keyframes rise{from{transform:translateY(18px);opacity:.7}}

<script>
(function(){
"use strict";

/* ================= icônes ================= */
var P = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  pm:'<path d="M5 12h14M12 5v14" opacity=".999"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
  users:'<circle cx="9" cy="8" r="3.4"/><path d="M2.5 19a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3.4 3.4 0 0 1 0 5"/><path d="M18 13.6a6.5 6.5 0 0 1 3.5 5.4"/>'
};
function ic(n){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>'; }

/* ================= données de départ ================= */
var DEF_CATS = ['TFT','Sport','LOL','VALO','Autres jeux','Nutrition'];
// Proposition de barème : [valeur du défi, prime versée quand l'objectif est
// atteint]. La valeur se partage au prorata des unités faites ; la prime
// récompense le fait d'aller au bout, là où les dernières unités coûtent le
// plus cher. Rien n'est imposé : le bouton ne remplit que les défis non chiffrés.
var BAREME = {
  'Top 1 TFT ×10':[150,60], '3★ 5 cost sur TFT':[90,0],
  'Courir 21 km':[140,60], '100 tractions':[120,50], '200 pompes':[90,30], '200 squats':[70,20],
  '1 game 0 mort en ranked':[60,0], 'Game à +30 kills/assists':[40,0], '1 penta sur LOL':[80,0],
  'Gagner 3 Arena':[45,15],
  '1 cut en ranked':[50,0], '1 ace Valorant':[70,0], '1 no scope':[45,0],
  'Win 3v3 ranked sur RL':[35,0], 'Gagner 5 retakes d’affilée':[65,0],
  'Finir Minecraft hardcore':[180,0], 'Top 1 Fall Guys':[40,0], 'Top 1 Fortnite':[60,0],
  'Top 1 Meccha Chameleon':[40,0], 'Top 1 Apex':[60,0], 'Geoguessr à moins de 10 km':[45,0],
  'Se faire insulter ou traiter de cheat':[25,0],
  '2 kg de nuggets':[110,40], '20 bières':[100,30]
};
var UNITS = ['fois','top 1','parties','manches','rounds','kills','km','tractions','pompes','squats','bières','verres','shots','kg','g','L','min','h'];
var STEPS = {km:0.5, kg:0.1, L:0.25, g:50, h:0.5, min:5};
// [titre, détail, catégorie, objectif, unité] — aucun point n'est fixé ici,
// le barème vous appartient.
var PACKS = [
  {id:'notre', name:'Notre liste', desc:'les 24 défis de la bande', items:[
    ['Top 1 TFT ×10','Dix premières places cumulées','TFT',10,'top 1'],
    ['3★ 5 cost sur TFT','','TFT',1,'fois'],

    ['Courir 21 km','En une ou plusieurs sorties','Sport',21,'km'],
    ['100 tractions','Cumulées sur la soirée','Sport',100,'tractions'],
    ['200 pompes','Cumulées sur la soirée','Sport',200,'pompes'],
    ['200 squats','Cumulés sur la soirée','Sport',200,'squats'],

    ['1 game 0 mort en ranked','Ranked uniquement','LOL',1,'fois'],
    ['Game à +30 kills/assists','Sur une seule partie','LOL',1,'fois'],
    ['1 penta sur LOL','','LOL',1,'fois'],
    ['Gagner 3 Arena','','LOL',3,'parties'],

    ['1 cut en ranked','','VALO',1,'fois'],
    ['1 ace Valorant','Cinq frags sur le même round','VALO',1,'fois'],
    ['1 no scope','','VALO',1,'fois'],
    ['Win 3v3 ranked sur RL','Rocket League','VALO',1,'fois'],
    ['Gagner 5 retakes d\u2019affilée','Les cinq à la suite, sans en perdre un','VALO',1,'fois'],

    ['Finir Minecraft hardcore','','Autres jeux',1,'fois'],
    ['Top 1 Fall Guys','','Autres jeux',1,'fois'],
    ['Top 1 Fortnite','','Autres jeux',1,'fois'],
    ['Top 1 Meccha Chameleon','','Autres jeux',1,'fois'],
    ['Top 1 Apex','','Autres jeux',1,'fois'],
    ['Geoguessr à moins de 10 km','Sur un round','Autres jeux',1,'fois'],
    ['Se faire insulter ou traiter de cheat','En game, témoins à l\u2019appui','Autres jeux',1,'fois'],

    ['2 kg de nuggets','Sans quitter la table','Nutrition',2,'kg'],
    ['20 bières','Sur toute la soirée','Nutrition',20,'bières']
  ]}
];

/* ================= état ================= */
var LS='manettedor.v2', LS_OLD='manettedor.v1', LS_ME='manettedor.me';
var S = {meta:{name:"La Manette d'Or", date:new Date().toISOString().slice(0,10), cats:null}, players:[], challenges:[], events:[]};
var MODE='local', DB=null, ME=null, LAN=null;
var fState='tous', fCat='tous', fQ='', toastTimer=null, undoIds=null, toastCb=null, AS=null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(s){ return document.querySelector(s); }
function byId(a,id){ for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function cats(){ if(!S.meta.cats||!S.meta.cats.length) S.meta.cats = DEF_CATS.map(function(n,i){ return {name:n, slot:i}; }); return S.meta.cats; }
function catOf(n){ var c=cats(); for(var i=0;i<c.length;i++) if(c[i].name===n) return c[i]; return {name:n||'Divers', slot:7}; }
function ensureCat(n, defer){
  if(!n) return false;
  var c=cats(); for(var i=0;i<c.length;i++) if(c[i].name===n) return false;
  c.push({name:n, slot:c.length%8});
  if(!defer) setMeta({cats:c});
  return true;
}
function initials(name){
  var p=String(name||'').trim().split(/\s+/);
  return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();
}
function ava(p,cls){ return '<span class="ava '+(cls||'')+'" title="'+esc(p?p.name:'')+'">'+esc(initials(p?p.name:'?'))+'</span>'; }
function norm(x){ return String(x==null?'':x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function fmtQ(n){ return (Math.round(n*100)/100).toString().replace('.',','); }
function stepFor(u){ return STEPS[u] || 1; }
function hasPts(ch){ return !!(ch && ch.points!=null && ch.points>0); }
// Les points d'une action sont recalculés depuis le défi : changer son barème
// met à jour tout l'historique. Seuls les bonus/malus manuels portent leur valeur.
function evPts(e){
  if(!e) return 0;
  if(!e.chId) return e.points||0;
  var ch=byId(S.challenges, e.chId);
  if(!ch) return e.points||0;
  var v = ptsFor(ch, e.qty||0);                 // au prorata des unités faites
  var b = ch.bonus||0;
  if(b>0){
    var tot=totalOf(ch.id);                     // la prime d'objectif se partage
    if(tot>0 && tot >= (ch.target||1)-1e-9) v += b*(e.qty||0)/tot;
  }
  return Math.round(v*100)/100;
}
function ptsFor(ch,q){
  var p = ch.points||0;
  var v = ch.scoring==='unit' ? p*q : p*q/(ch.target||1);
  return Math.round(v*100)/100;      // on garde les décimales : le cumul reste exact
}
function fmtPts(v){
  var n = Number(v)||0;
  if(Math.abs(n)>=10 || n===Math.round(n)) return String(Math.round(n));
  return String(Math.round(n*10)/10).replace('.',',');
}

/* ================= stockage ================= */
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function loadLocal(){
  var raw=null;
  try{ raw = localStorage.getItem(LS); }catch(e){}
  if(!raw){ try{ raw = localStorage.getItem(LS_OLD); }catch(e){} }
  if(raw){ try{ var d=JSON.parse(raw);
    if(d&&d.players){ S={meta:d.meta||S.meta, players:d.players||[], challenges:d.challenges||[], events:d.events||[]}; }
  }catch(e){} }
  if(!S.meta.cats) S.meta.cats=null;
  cats();
  S.challenges.forEach(function(c){ ensureCat(c.cat); if(!c.unit) c.unit='fois'; if(!c.scoring) c.scoring='total'; });
  try{ ME = localStorage.getItem(LS_ME); }catch(e){}
}
function localUpsert(coll,obj){
  var a=S[coll];
  for(var i=0;i<a.length;i++) if(a[i].id===obj.id){ a[i]=obj; return; }
  a.push(obj);
}
function strip(obj){ var b={}; for(var k in obj) if(k!=='id') b[k]=obj[k]; return b; }
// Toutes les écritures passent par ici : un lot = un seul rendu et un seul appel réseau.
function applyOps(ops){
  if(!ops.length) return;
  ops.forEach(function(o){
    if(o.op==='put') localUpsert(o.coll, o.obj);
    else S[o.coll]=S[o.coll].filter(function(x){ return x.id!==o.id; });
  });
  sortAll(); render();
  if(MODE==='cloud') ops.forEach(function(o){
    if(o.op==='put') DB.collection(o.coll).doc(o.obj.id).set(strip(o.obj)).catch(fail);
    else DB.collection(o.coll).doc(o.id).delete().catch(fail);
  });
  else if(MODE==='lan') lanOp(ops.length===1 ? ops[0] : {op:'batch', ops:ops});
  else persist();
}
function put(coll,obj){ applyOps([{op:'put', coll:coll, obj:obj}]); }
function drop(coll,id){ applyOps([{op:'drop', coll:coll, id:id}]); }
function clearOps(){
  var ops=[];
  ['events','challenges','players'].forEach(function(coll){
    S[coll].forEach(function(x){ ops.push({op:'drop', coll:coll, id:x.id}); });
  });
  return ops;
}
function setMeta(patch){
  for(var k in patch) S.meta[k]=patch[k];
  render();
  if(MODE==='cloud') DB.doc('meta/config').set(S.meta).catch(fail);
  else if(MODE==='lan') lanOp({op:'meta', meta:S.meta});
  else persist();
}
function fail(e){ toast('Synchro impossible (' + ((e&&e.code)||'erreur') + ')'); }
function sortAll(){
  S.players.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  S.challenges.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  S.events.sort(function(a,b){ return (b.at||0)-(a.at||0); });
}

/* ================= synchro ================= */
function boot(){
  loadLocal(); sortAll(); render();
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('db').then(function(db){ if(db) startCloud(db); }).catch(function(){});
    return;
  }
  startLan();
}
function startCloud(db){
  DB=db; MODE='cloud';
  var before = JSON.parse(JSON.stringify(S)), seen={players:false, challenges:false};
  status('cloud');
  db.doc('meta/config').onSnapshot(function(s){ if(s.exists){ var d=s.data(); for(var k in d) S.meta[k]=d[k]; render(); } }, function(){});
  ['players','challenges','events'].forEach(function(coll){
    db.collection(coll).onSnapshot(function(snap){
      S[coll]=snap.docs.map(function(d){ var o=d.data()||{}; o.id=d.id; return o; });
      sortAll(); render();
      if(coll in seen){ seen[coll]=true; seed(); }
    }, function(){});
  });
  function seed(){
    if(!seen.players||!seen.challenges) return;
    seen={players:false, challenges:false};
    if(S.players.length||S.challenges.length) return;
    if(!before.players.length&&!before.challenges.length) return;
    S.players=before.players; S.challenges=before.challenges; S.events=before.events;
    S.players.forEach(function(p){ put('players',p); });
    S.challenges.forEach(function(c){ put('challenges',c); });
    S.events.forEach(function(e){ put('events',e); });
    setMeta(before.meta);
  }
}
function startLan(){
  fetch('api/state', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : Promise.reject(0); })
  .then(function(d){
    MODE='lan'; LAN={rev:d.rev||0, host:d.host||location.host};
    applyRemote(d.state);
    var es = new EventSource('api/events');
    es.addEventListener('state', function(m){
      try{ var p=JSON.parse(m.data); LAN.rev=p.rev; applyRemote(p.state); }catch(e){}
    });
    es.addEventListener('peers', function(m){ try{ LAN.peers=JSON.parse(m.data).peers; status('lan'); }catch(e){} });
    es.addEventListener('version', function(m){
      var d; try{ d=JSON.parse(m.data); }catch(e){ return; }
      if(d.restart) return toast('Serveur mis à jour — fermez et relancez la fenêtre du serveur', null, 'Compris', function(){});
      if(!d.updated || d.updated.indexOf('index.html')<0) return;
      var busy = !$('#scrim').hidden || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
      if(busy) return toast('Nouvelle version disponible', null, 'Recharger', function(){ location.reload(); });
      toast('Nouvelle version — rechargement…');
      setTimeout(function(){ location.reload(); }, 1600);
    });
    es.onerror = function(){ status('lan-off'); };
    es.onopen = function(){ status('lan'); };
    status('lan');
  }).catch(function(){ status('local'); });
}
function applyRemote(st){
  if(!st) return;
  if(st.meta) S.meta = st.meta;
  S.players = st.players||[]; S.challenges = st.challenges||[]; S.events = st.events||[];
  sortAll(); render();
}
function lanOp(op){
  fetch('api/op', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(op)})
    .then(function(r){ if(!r.ok) throw new Error('refus'); })
    .catch(function(){ toast('Serveur injoignable — resynchronisation'); setTimeout(resync, 1500); });
}
function resync(){
  fetch('api/state', {cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(d){ applyRemote(d.state); status('lan'); })
    .catch(function(){ status('lan-off'); });
}
function status(kind){
  var el=$('#statusLine'), n=(LAN&&LAN.peers)||0;
  el.className='statusLine' + (kind==='cloud'||kind==='lan' ? ' on' : '');
  var txt = kind==='cloud' ? 'Synchro en direct · lien partagé'
    : kind==='lan' ? ('Réseau local · ' + n + ' appareil' + (n>1?'s':''))
    : kind==='lan-off' ? 'Serveur local hors ligne'
    : 'Hors ligne · cet appareil uniquement';
  el.innerHTML = '<i></i><span>'+txt+'</span>' + (kind==='lan' ? ' <button type="button" id="lanShare">Partager l’adresse</button>' : '');
}

/* ================= calculs ================= */
function scores(){
  var m={}, out=[];
  S.players.forEach(function(p){ m[p.id]={p:p, total:0, acts:0, byCat:{}}; out.push(m[p.id]); });
  S.events.forEach(function(e){
    var r=m[e.playerId]; if(!r) return;
    var v=evPts(e);
    r.total+=v; r.acts++;
    var c=e.cat||'Divers'; r.byCat[c]=(r.byCat[c]||0)+v;
  });
  out.sort(function(a,b){ return b.total-a.total || a.p.name.localeCompare(b.p.name); });
  return out;
}
function progress(){
  var m={}; S.events.forEach(function(e){ if(e.chId) m[e.chId]=(m[e.chId]||0)+(e.qty||0); }); return m;
}
function contribMap(){
  var m={};
  for(var i=S.events.length-1;i>=0;i--){
    var e=S.events[i]; if(!e.chId) continue;
    var p=byId(S.players, e.playerId); if(!p) continue;
    if(!m[e.chId]) m[e.chId]=[];
    if(m[e.chId].indexOf(p)<0) m[e.chId].push(p);
  }
  return m;
}
function done(ch,prog){ return (prog[ch.id]||0) >= (ch.target||1) - 1e-9; }

/* ================= rendu ================= */
var dirty={defis:true, joueurs:true, classement:true, stats:true}, rafId=null, curView='defis';
function render(){
  for(var k in dirty) dirty[k]=true;
  if(rafId) return;
  rafId = requestAnimationFrame(function(){ rafId=null; renderNow(); });
}
function renderNow(){
  var prog=progress(), sc=scores();
  $('#partyName').textContent = S.meta.name || "La Manette d'Or";
  var d = S.meta.date ? new Date(S.meta.date+'T12:00:00') : new Date();
  $('#kicker').textContent = 'Soirée du ' + d.toLocaleDateString('fr-FR',{day:'numeric', month:'long'});
  var nDone = S.challenges.filter(function(c){ return done(c,prog); }).length;
  var pts = S.events.reduce(function(a,e){ return a+evPts(e); },0);
  $('#kpis').innerHTML =
    kpi(nDone+'/'+S.challenges.length,'Défis') + kpi(fmtPts(pts),'Points') +
    kpi(S.players.length,'Joueurs') + kpi(S.events.length,'Actions');
  var me = ME ? byId(S.players,ME) : null; if(!me) ME=null;
  $('#meAva').textContent = me ? initials(me.name) : '?';
  $('#meAva').className = 'ava' + (me ? ' on' : '');
  $('#meName').textContent = me ? me.name : 'Je suis…';
  if(!$('#gearBtn').firstChild) $('#gearBtn').innerHTML = ic('gear');
  renderRail(sc);
  if(!dirty[curView]) return;
  dirty[curView]=false;
  if(curView==='defis') renderDefis(prog);
  else if(curView==='joueurs') renderJoueurs(sc);
  else if(curView==='classement') renderClassement(sc);
  else renderStats(sc);
}
function kpi(v,l){ return '<div class="kpi"><b>'+v+'</b><span>'+l+'</span></div>'; }

// Colonne de droite sur grand écran : ce qu'on veut garder sous les yeux
// pendant qu'on est dans une autre vue.

      }).join('') + '</div>';

function renderDefis(prog){
  var el=$('#view-defis');
  if(!S.challenges.length){
    el.innerHTML = '<div class="empty"><h2>Aucun défi pour l’instant</h2>' +
      '<p>Chargez votre liste, puis ajoutez les défis qui vous passent par la tête. Chacun a sa catégorie, son objectif et son unité.</p>' +

      '<div class="packs">' + PACKS.map(packHtml).join('') + '</div></div>';
    return;
  }
  var cm = contribMap();
  var list = S.challenges.slice();
  if(fState==='encours') list=list.filter(function(c){ return !done(c,prog); });
  if(fState==='faits')   list=list.filter(function(c){ return done(c,prog); });
  if(fState==='nopts')   list=list.filter(function(c){ return !hasPts(c); });
  if(fCat!=='tous')      list=list.filter(function(c){ return (c.cat||'Divers')===fCat; });
  if(fQ){ var q=norm(fQ);
    list=list.filter(function(c){ return norm(c.title).indexOf(q)>=0 || norm(c.note).indexOf(q)>=0 || norm(c.cat).indexOf(q)>=0; }); }

  var noPts = S.challenges.filter(function(c){ return !hasPts(c); }).length;
  var used={}; S.challenges.forEach(function(c){ used[c.cat||'Divers']=1; });

  var html = '<div class="shead"><h2>Défis</h2><button class="btn pri qt" id="newCh">'+ic('plus')+'Nouveau</button></div>';

    html += '<div class="baremeBar"><span>'+noPts+' défi'+(noPts>1?'s':'')+' sans points</span>' +

    html += '<div class="search">'+ic('search')+'<input id="chSearch" type="search" autocomplete="off" ' +
      'placeholder="Rechercher un défi" aria-label="Rechercher un défi" value="'+esc(fQ)+'" /></div>';

    [['tous','Tous'],['encours','En cours'],['faits','Validés']]

        return '<button class="fc" data-fs="'+f[0]+'" aria-pressed="'+(fState===f[0])+'">'+f[1]+'</button>'; }).join('') +
    (cl.length>1 ? '<button class="fc" data-fc="tous" aria-pressed="'+(fCat==='tous')+'">Toutes</button>' +
      cl.map(function(c){
        return '<button class="fc" data-fc="'+esc(c.name)+'" aria-pressed="'+(fCat===c.name)+'">' +
          '<i class="dot" style="--c:var(--c'+(c.slot%8)+')"></i>'+esc(c.name)+'</button>'; }).join('') : '') +
    '</div>';

  if(!list.length){ html += '<div class="empty"><p style="margin:0">Aucun défi dans ce filtre.</p></div>'; }
  else if(fCat!=='tous' || fState!=='tous'){ html += '<div class="list">' + list.map(function(c){ return rowHtml(c,prog,cm); }).join('') + '</div>'; }
  else {
    var groups = cl.map(function(c){ return {cat:c, items:list.filter(function(x){ return (x.cat||'Divers')===c.name; })}; })
      .filter(function(g){ return g.items.length; });
    var others = list.filter(function(x){ return !cl.some(function(c){ return c.name===(x.cat||'Divers'); }); });
    if(others.length) groups.push({cat:{name:'Divers', slot:7}, items:others});
    html += '<div class="groups">' + groups.map(function(g){
      var d2 = g.items.filter(function(c){ return done(c,prog); }).length;

      return '<div class="group"><div class="grpH"><i class="dot" style="--c:var(--c'+(g.cat.slot%8)+')"></i>' +

        '<div class="list">' + items.map(function(c){ return rowHtml(c,prog,cm); }).join('') + '</div></div>';

    '<div class="packs">' + PACKS.map(packHtml).join('') + '</div>';

function packHtml(p){

function rowHtml(ch,prog,cm){

/* ================= feuilles ================= */
var lastFocus=null;
function sheet(kicker,title,body){
  if($('#scrim').hidden) lastFocus = document.activeElement;
  $('#sheet').innerHTML = '<div class="sh"><div><div class="kicker">'+kicker+'</div><h2 id="sheetTitle">'+title+'</h2></div>' +
    '<button class="ib" data-close="1" aria-label="Fermer">'+ic('close')+'</button></div>' + body;
  $('#toast').hidden=true;          // une notification en cours ne doit pas masquer la feuille
  $('#scrim').hidden=false;
  $('#sheet').scrollTop=0;
  $('#sheet').focus();
}
function closeSheet(){
  if($('#scrim').hidden) return;
  AS=null;
  $('#scrim').hidden=true;
  if(lastFocus && document.contains(lastFocus)){ try{ lastFocus.focus(); }catch(e){} }
  lastFocus=null;
}

function addSheet(chId){
  var ch=byId(S.challenges,chId); if(!ch) return;
  if(!S.players.length){ toast('Ajoutez d\u2019abord des joueurs'); return go('joueurs'); }
  var prog=progress(), q0=prog[chId]||0, t=ch.target||1;
  var step=stepFor(ch.unit);
  var snap=function(x){ return Math.round(Math.round(x/step)*step*100)/100; };
  // Objectif atteint : la course du curseur repart en entier, chacun peut encore participer.
  var rest=snap(t-q0);
  var maxV = t>1 ? (rest>=step ? rest : snap(t)) : 1;
  var val = t>1 ? Math.min(maxV, Math.max(step, snap(t/10))) : 1;
  var quick=[]; [step, snap(t/20), snap(t/10), snap(t/4)].forEach(function(v){

            '<button type="button" class="btn qt" data-q="'+maxV+'">'+(rest>=step?'Reste':'Objectif')+' ('+fmtQ(maxV)+')</button>' +
          '</div>' : '') +

// Ce que la feuille d'ajout va écrire : un apport par joueur sélectionné.
function asParts(){
  if(!AS) return [];
  var ids=S.players.filter(function(p){ return AS.sel[p.id]; }).map(function(p){ return p.id; });
  if(!ids.length) return [];
  var r=$('#qR');
  var q = AS.t>1 ? (r ? parseFloat(r.value) : AS.step) : 1;
  if(ids.length>1 && AS.mode==='detail')
    return ids.map(function(id){ return {playerId:id, qty:AS.det[id]||0}; })
              .filter(function(x){ return x.qty>0; });
  if(ids.length>1){
    // parts égales : la quantité saisie est celle du groupe, le reste de division
    // va au premier pour que le total tombe juste
    var each=Math.round(q/ids.length*100)/100;
    var parts=ids.map(function(id){ return {playerId:id, qty:each}; });
    var diff=Math.round((q-each*ids.length)*100)/100;
    if(diff) parts[0].qty=Math.round((parts[0].qty+diff)*100)/100;
    return parts;
  }
  return [{playerId:ids[0], qty:q}];
}
function asUpd(){
  if(!AS || $('#scrim').hidden) return;
  var n=S.players.filter(function(p){ return AS.sel[p.id]; }).length;
  var detail = n>1 && AS.mode==='detail';
  var mr=$('#modeRow'); if(mr) mr.hidden = n<2;
  var qb=$('#qBlock'); if(qb) qb.hidden = detail || AS.t<=1;
  var db=$('#detBlock'); if(db) db.hidden = !detail;
  var lbl=$('#qLbl'); if(lbl) lbl.textContent = n>1 ? 'Quantité ajoutée (pour le groupe)' : 'Quantité ajoutée';
  S.players.forEach(function(p){
    var row=document.querySelector('[data-dr="'+p.id+'"]');
    if(row) row.hidden = !AS.sel[p.id];
    var v=document.getElementById('dv-'+p.id);
    if(v) v.textContent=fmtQ(AS.det[p.id]||0);
  });
  var r=$('#qR');
  if(r){
    var cur=parseFloat(r.value);
    var qv=$('#qV'); if(qv) qv.textContent=fmtQ(cur);
    r.style.setProperty('--pct', ((cur-AS.step)/Math.max(0.0001,(AS.maxV-AS.step))*100).toFixed(1));
  }
  var parts=asParts();
  var total=Math.round(parts.reduce(function(a,x){ return a+x.qty; },0)*100)/100;
  var sum;
  if(!parts.length) sum='Sélectionnez au moins un joueur';
  else {
    var head = AS.t>1
      ? '+'+fmtQ(total)+'\u202f'+(AS.ch.unit||'')+' au défi'
      : (n>1 && AS.mode==='egal' ? 'Validé ensemble' : '+'+fmtQ(total)+' validation'+(total>1?'s':''));
    var tail = !hasPts(AS.ch) ? 'points à définir'
      : parts.map(function(x){
          var pl=byId(S.players,x.playerId);
          return (n>1 ? esc(pl?pl.name:'')+' ' : '') + fmtPts(ptsFor(AS.ch,x.qty)) + ' pts';
        }).join(' · ');
    sum = head + ' · ' + tail;
  }
  $('#asSum').textContent=sum;
  $('#doAdd').disabled = !parts.length || total<=0;
}
// Corriger après coup : le total de chaque joueur sur ce défi, ajustable.
// Une baisse retire de ses apports les plus récents, une hausse s'ajoute au
// dernier, ou en crée un. Tout part aussitôt sur les autres appareils.
function totalOf(chId, pid){
  var q=0;
  S.events.forEach(function(e){
    if(e.chId!==chId) return;
    if(pid && e.playerId!==pid) return;
    q+=(e.qty||0);
  });
  return Math.round(q*100)/100;
}
function setPlayerTotal(chId, pid, want){
  var ch=byId(S.challenges,chId); if(!ch) return;
  var evs=S.events.filter(function(e){ return e.chId===chId && e.playerId===pid; }); // du plus récent au plus ancien
  var cur=totalOf(chId, pid);
  var goal=Math.max(0, Math.round((want||0)*100)/100);
  var diff=Math.round((goal-cur)*100)/100;
  if(!diff) return;
  var ops=[], clone=function(e){ var c={}; for(var k in e) c[k]=e[k]; return c; };
  if(diff>0){
    if(evs.length){
      var top=clone(evs[0]);
      top.qty=Math.round((top.qty+diff)*100)/100;
      top.points=ptsFor(ch, top.qty);
      ops.push({op:'put', coll:'events', obj:top});
    } else {
      ops.push({op:'put', coll:'events', obj:{id:uid(), chId:chId, playerId:pid,
        cat:ch.cat||'Divers', title:ch.title, unit:ch.unit||'fois',
        qty:diff, points:ptsFor(ch,diff), at:Date.now()}});
    }
  } else {
    var rest=-diff;
    for(var i=0;i<evs.length && rest>0.0001;i++){
      var e=evs[i], take=Math.min(e.qty||0, rest);
      rest=Math.round((rest-take)*100)/100;
      var nq=Math.round(((e.qty||0)-take)*100)/100;
      if(nq<=0) ops.push({op:'drop', coll:'events', id:e.id});
      else { var c2=clone(e); c2.qty=nq; c2.points=ptsFor(ch,nq); ops.push({op:'put', coll:'events', obj:c2}); }
    }
  }
  applyOps(ops);
}

/* ================= actions ================= */
function award(chId, playerId, qty, ptsOverride, label){
  awardMany(chId, [{playerId:playerId, qty:qty}], ptsOverride, label);
}
// Une action peut créditer plusieurs joueurs d'un coup : un événement par
// participant, écrits en un seul lot, annulables ensemble.
function awardMany(chId, parts, ptsOverride, label){
  var ch = chId ? byId(S.challenges,chId) : null;
  var before = ch ? done(ch,progress()) : false;
  var now=Date.now(), ops=[], ids=[];
  parts.forEach(function(pt, i){
    if(!pt || !pt.playerId) return;
    if(!pt.qty && ptsOverride==null) return;
    var ev = {id:uid(), chId:chId||null, playerId:pt.playerId,
      cat: ch ? (ch.cat||'Divers') : 'Divers',
      title: ch ? ch.title : (label||'Ajustement'),
      unit: ch ? (ch.unit||'fois') : '',
      qty: pt.qty||0,
      points: ptsOverride!=null ? ptsOverride : (ch ? ptsFor(ch, pt.qty||0) : 0),
      at: now+i};
    ops.push({op:'put', coll:'events', obj:ev}); ids.push(ev.id);
  });
  if(!ops.length) return;
  applyOps(ops);
  var names = parts.map(function(pt){ var p=byId(S.players,pt.playerId); return p?p.name:''; })
    .filter(Boolean).join(', ');
  if(ch && !before && done(ch,progress())) toast('Défi validé — ' + ch.title, ids);
  else if(ch && !hasPts(ch)) toast('Progression enregistrée · points à définir', ids);
  else if(ids.length>1) toast(names + ' · ' + fmtPts(ops.reduce(function(a,x){ return a+x.obj.points; },0)) + ' pts répartis', ids);
  else toast(names + ' ' + (ops[0].obj.points>0?'+':'') + fmtPts(ops[0].obj.points) + ' pts', ids);
}
function toast(msg, undo, label, cb){
  undoIds = undo ? (undo.length ? undo : [undo]) : null;
  toastCb = cb || null;
  $('#toastMsg').textContent = msg;
  var act=$('#toastAct');
  act.hidden = !(undoIds || toastCb);
  act.textContent = toastCb ? (label||'OK') : 'Annuler';
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  if(!toastCb) toastTimer = setTimeout(function(){ $('#toast').hidden=true; }, 4500);
}
function applyBareme(){
  var ops=[], n=0;
  S.challenges.forEach(function(c){
    var b=BAREME[c.title];
    if(!b || hasPts(c)) return;                 // on ne remplace jamais un barème déjà fixé
    var o={}; for(var k in c) o[k]=c[k];
    o.points=b[0]; o.bonus=b[1]; n++;
    ops.push({op:'put', coll:'challenges', obj:o});
  });
  applyOps(ops);
  toast(n ? n+' défis chiffrés — ajustez ce qui ne vous va pas' : 'Aucun défi à chiffrer');
}
function addPack(id){
  var pk=null; PACKS.forEach(function(p){ if(p.id===id) pk=p; });
  if(!pk) return;
  var have={}; S.challenges.forEach(function(c){ have[c.title]=1; });
  var now=Date.now(), added=false, ops=[];
  pk.items.forEach(function(it,i){
    if(have[it[0]]) return;
    added = ensureCat(it[2], true) || added;
    ops.push({op:'put', coll:'challenges', obj:{id:uid(), title:it[0], note:it[1], cat:it[2],
      points:null, scoring:'total', target:it[3], unit:it[4], createdAt:now+i}});
  });
  if(added) setMeta({cats:cats()});
  applyOps(ops);
  toast(ops.length ? ops.length+' défis ajoutés' : 'Déjà dans la liste');
}

/* ================= interactions ================= */
document.addEventListener('click', function(evt){
  var t = evt.target.closest('button'); if(!t) return;
  var d = t.dataset;

  if(t.matches('nav.tabs button')) return go(d.view);
  if(d.close) return closeSheet();
  if(d.fs!==undefined){ fState=d.fs; return render(); }
  if(d.fc!==undefined){ fCat=d.fc; return render(); }
  if(d.pack) return addPack(d.pack);
  if(t.id==='newCh') return chSheet(null);
  if(d.add) return addSheet(d.add);

  if(d.w){
    if(!AS) return;
    var on = t.getAttribute('aria-pressed')==='true';
    var nSel = S.players.filter(function(p){ return AS.sel[p.id]; }).length;
    if(on && nSel<=1) return;                 // il faut au moins un joueur
    if(on) delete AS.sel[d.w]; else AS.sel[d.w]=true;
    t.setAttribute('aria-pressed', on?'false':'true');
    asUpd(); return;
  }
  if(t.id==='whoAll'){
    if(!AS) return;
    S.players.forEach(function(p){ AS.sel[p.id]=true; });
    $('#whoRow').querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed','true'); });
    asUpd(); return;
  }
  if(d.mode){
    if(!AS) return;
    AS.mode=d.mode;
    t.parentNode.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode===d.mode)); });
    asUpd(); return;
  }
  if(d.dstep){
    if(!AS) return;
    var bits=d.dstep.split('|'), pid=bits[0], dir=parseFloat(bits[1]);
    var stepv = AS.t>1 ? AS.step : 1;
    AS.det[pid]=Math.max(0, Math.round(((AS.det[pid]||0) + dir*stepv)*100)/100);
    asUpd(); return;
  }
  if(d.sc){ t.parentNode.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
    t.setAttribute('aria-pressed','true'); return; }
  if(d.q){ var r=$('#qR'); if(r){ r.value=d.q; asUpd(); } return; }

  if(t.id==='doAdd'){
    if(!AS) return;
    var parts=asParts(), chId=AS.ch.id;
    closeSheet();
    return awardMany(chId, parts);
  }

  if(d.menu){
    var c2=byId(S.challenges,d.menu); if(!c2) return;
    var nEv=S.events.filter(function(e){ return e.chId===c2.id; }).length;
    return sheet(esc(c2.cat||''), esc(c2.title),
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<button class="btn full" data-prog="'+c2.id+'">'+ic('undo')+'Corriger les totaux</button>' +
      '<button class="btn full" data-editch="'+c2.id+'">'+ic('edit')+'Modifier le défi</button>' +
      '<button class="btn full dg" data-delch="'+c2.id+'">'+ic('trash')+'Supprimer le défi</button></div>');
  }
  if(d.editch){ var c3=byId(S.challenges,d.editch); closeSheet(); return chSheet(c3); }
  if(d.prog) return progSheet(d.prog);
  if(d.pstep){
    var pb=d.pstep.split('|'), chT=byId(S.challenges,pb[0]); if(!chT) return;
    var st=stepFor(chT.unit);
    setPlayerTotal(chT.id, pb[1], Math.round((totalOf(chT.id, pb[1])+parseFloat(pb[2])*st)*100)/100);
    progSheet(chT.id); return;
  }

  if(d.pmenu){
    var p2=byId(S.players,d.pmenu); if(!p2) return;
    return sheet('Joueur', esc(p2.name),
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<button class="btn full" data-setme="'+p2.id+'">C’est moi sur cet appareil</button>' +
      '<button class="btn full" data-adj="'+p2.id+'">'+ic('pm')+'Bonus ou malus</button>' +
      '<button class="btn full" data-editp="'+p2.id+'">'+ic('edit')+'Renommer</button>' +
      '<button class="btn full dg" data-delp="'+p2.id+'">'+ic('trash')+'Retirer</button></div>');
  }
  if(d.setme){ ME=d.setme; try{ localStorage.setItem(LS_ME,ME); }catch(e){} closeSheet(); return render(); }
  if(d.editp){
    var p3=byId(S.players,d.editp);
    return sheet('Joueur','Renommer',
      '<form id="epForm" class="stack-form"><div class="fld"><label for="epName">Nom</label>' +
      '<input class="inp" id="epName" maxlength="24" value="'+esc(p3.name)+'" /></div>' +
      '<input type="hidden" id="epId" value="'+p3.id+'" />' +
      '<button class="btn pri full" type="submit">Enregistrer</button></form>');
  }
  if(d.adj){
    return sheet('Joueur','Bonus ou malus',
      '<form id="adjForm" class="stack-form"><div class="g2">' +
      '<div class="fld"><label for="adjP">Points</label><input class="inp mono" id="adjP" type="number" value="10" /></div>' +
      '<div class="fld"><label for="adjW">Motif</label><input class="inp" id="adjW" maxlength="50" placeholder="Gage réussi" /></div></div>' +
      '<input type="hidden" id="adjId" value="'+d.adj+'" />' +
      '<button class="btn pri full" type="submit">Appliquer</button></form>');
  }
  if(d.delp){
    if(d.armed){
      var opsP=S.events.filter(function(e){ return e.playerId===d.delp; })
        .map(function(e){ return {op:'drop', coll:'events', id:e.id}; });
      opsP.push({op:'drop', coll:'players', id:d.delp});
      if(ME===d.delp){ ME=null; try{ localStorage.removeItem(LS_ME); }catch(e){} }
      applyOps(opsP); closeSheet(); return toast('Joueur retiré');
    }
    t.dataset.armed='1'; t.innerHTML=ic('trash')+'Confirmer'; return;
  }
  if(d.delcat){
    var inUse=S.challenges.filter(function(c){ return (c.cat||'')===d.delcat; }).length;
    if(inUse) return toast(inUse+' défi'+(inUse>1?'s utilisent':' utilise')+' encore « '+d.delcat+' »');
    setMeta({cats: cats().filter(function(c){ return c.name!==d.delcat; })});
    settingsSheet(); return;
  }
  if(d.delev){ drop('events', d.delev); return toast('Action annulée'); }

  if(t.id==='meBtn'){
    if(!S.players.length){ toast('Ajoutez d’abord des joueurs'); return go('joueurs'); }
    return sheet('Cet appareil','Je suis…',
      '<div class="pplRow">' + S.players.map(function(p){
        return '<button data-setme="'+p.id+'">'+ava(p,'sm')+esc(p.name)+'</button>'; }).join('') + '</div>');
  }
  if(t.id==='baremeBtn') return applyBareme();
  if(t.id==='gearBtn'||t.id==='gear2') return settingsSheet();
  if(t.id==='lanShare'){
    return sheet('Réseau local','Rejoindre la soirée',
      '<p class="muted">Sur le même Wi-Fi, ouvrez cette adresse dans un navigateur :</p>' +
      '<div class="card mono" style="margin-top:10px;font-size:15px;text-align:center;word-break:break-all">'+esc(location.origin)+'</div>');
  }
  if(t.id==='recapBtn') return recapSheet();
  if(t.id==='recapCopy'){
    var ta=$('#recapTxt'); ta.select();
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){ toast('Copié'); },function(){ toast('Sélectionnez puis copiez'); });
    else toast('Sélectionnez puis copiez');
    return;
  }
  if(t.id==='sSave'){ setMeta({name:$('#sName').value.trim()||S.meta.name, date:$('#sDate').value||S.meta.date}); closeSheet(); return; }
  if(t.id==='sUpdate'){
    t.disabled=true; t.textContent='Recherche…';
    fetch('api/update', {method:'POST'}).then(function(r){ return r.json(); }).then(function(d){
      if(d.offline){ toast('Pas de connexion à GitHub'); t.disabled=false; t.textContent='Réessayer'; return; }
      if(!d.updated.length){ toast('Déjà à jour'); t.disabled=false; t.textContent='Déjà à jour'; return; }
      if(d.restart) toast('Serveur mis à jour — fermez et relancez la fenêtre du serveur');
      else { toast('Mise à jour installée — rechargement'); setTimeout(function(){ location.reload(); }, 900); }
    }).catch(function(){ toast('Mise à jour impossible'); t.disabled=false; t.textContent='Réessayer'; });
    return;
  }
  if(t.id==='sExport'){
    return sheet('Sauvegarde','Exporter',
      '<p class="muted" style="margin-bottom:10px">Copiez ce texte pour garder une trace de la soirée.</p>' +
      '<textarea class="inp mono" rows="10" style="min-height:200px;font-size:11px">'+esc(JSON.stringify(S))+'</textarea>');
  }
  if(t.id==='sImport'){
    return sheet('Sauvegarde','Importer',
      '<p class="muted" style="margin-bottom:10px">Collez une sauvegarde — elle remplacera les données actuelles.</p>' +
      '<textarea class="inp mono" id="impTxt" rows="8" style="min-height:170px;font-size:11px"></textarea>' +
      '<button class="btn pri full" id="impGo" style="margin-top:10px">Importer</button>');
  }
  if(t.id==='impGo'){
    try{
      var d4=JSON.parse($('#impTxt').value);
      if(!d4||!d4.players) throw 0;
      var opsI=clearOps();
      ['players','challenges','events'].forEach(function(coll){
        (d4[coll]||[]).forEach(function(x){ if(x&&x.id) opsI.push({op:'put', coll:coll, obj:x}); });
      });
      if(d4.meta) setMeta(d4.meta);
      applyOps(opsI);
      closeSheet(); toast('Sauvegarde importée');
    }catch(e){ toast('Ce texte n’est pas une sauvegarde valide'); }
    return;
  }
  if(t.id==='sReset'){
    if(d.armed){
      applyOps(clearOps());
      ME=null; try{ localStorage.removeItem(LS_ME); }catch(e){}
      closeSheet(); return toast('Tout a été effacé');
    }
    t.dataset.armed='1'; t.textContent='Confirmer l’effacement'; return;
  }
  if(t.id==='toastAct'){
    var cb=toastCb; toastCb=null;
    if(undoIds){ applyOps(undoIds.map(function(id){ return {op:'drop', coll:'events', id:id}; })); undoIds=null; }
    $('#toast').hidden=true;
    if(cb) cb();
    return;
  }
});

document.addEventListener('input', function(e){
  if(e.target.id!=='chSearch') return;
  fQ = e.target.value;
  dirty.defis=true; curView='defis'; renderNow();
  var i=$('#chSearch');
  if(i){ i.focus(); try{ i.setSelectionRange(i.value.length, i.value.length); }catch(err){} }
});

document.addEventListener('change', function(e){
  if(e.target.classList && e.target.classList.contains('ptIn')){
    var chId=e.target.dataset.ch, pid=e.target.dataset.p, v=parseFloat(e.target.value);
    if(isNaN(v) || v<0){ progSheet(chId); return; }
    setPlayerTotal(chId, pid, v); progSheet(chId); return;
  }
  if(e.target.id==='chCat'){
    var n=$('#chNewCat');
    n.hidden = e.target.value!=='__new';
    if(!n.hidden) n.focus();
  }
});

document.addEventListener('submit', function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==='chForm'){
    var title=$('#chTitle').value.trim(); if(!title) return;
    var cat=$('#chCat').value;
    if(cat==='__new'){ cat=$('#chNewCat').value.trim() || cats()[0].name; ensureCat(cat); }
    var id=$('#chId').value;
    var obj = id ? byId(S.challenges,id) : {id:uid(), createdAt:Date.now()};
    obj.title=title; obj.note=$('#chNote').value.trim(); obj.cat=cat;
    obj.target=Math.max(0.1, parseFloat($('#chTarget').value)||1);
    obj.unit=$('#chUnit').value.trim()||'fois';
    var pv=$('#chPts').value.trim();
    obj.points = pv==='' ? null : Math.max(0, parseInt(pv,10)||0);
    var bv=$('#chBonus').value.trim();
    obj.bonus = bv==='' ? 0 : Math.max(0, parseInt(bv,10)||0);
    obj.scoring=$('#chScore').querySelector('[aria-pressed="true"]').dataset.sc;
    put('challenges', obj); closeSheet(); toast(id?'Défi mis à jour':'Défi ajouté');
    return;
  }
  if(f.id==='pForm'){
    var name=$('#pName').value.trim(); if(!name) return;
    var p={id:uid(), name:name, slot:S.players.length%8, createdAt:Date.now()};
    put('players', p);
    if(!ME){ ME=p.id; try{ localStorage.setItem(LS_ME,ME); }catch(e2){} render(); }
    toast(name+' entre dans la partie');
    setTimeout(function(){ var i=$('#pName'); if(i) i.focus(); },40);
    return;
  }
  if(f.id==='epForm'){
    var pl=byId(S.players,$('#epId').value); if(!pl) return;
    pl.name=$('#epName').value.trim()||pl.name;
    put('players',pl); closeSheet(); return;
  }
  if(f.id==='adjForm'){
    var v=parseInt($('#adjP').value,10)||0;
    var why=$('#adjW').value.trim()||(v<0?'Malus':'Bonus');
    var pid=$('#adjId').value; closeSheet();
    return award(null, pid, 0, v, why);
  }
  if(f.id==='catForm'){
    var n2=$('#catName').value.trim(); if(!n2) return;
    ensureCat(n2); settingsSheet(); return;
  }
});

$('#scrim').addEventListener('click', function(e){ if(e.target===$('#scrim')) closeSheet(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
$('#partyName').addEventListener('click', settingsSheet);

boot();
})();
</script>
