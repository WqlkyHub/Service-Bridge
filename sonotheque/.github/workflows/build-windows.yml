# Fabrique l'installateur Windows (.exe) automatiquement.
# Ce fichier ne s'active que lorsque la Sonothèque est à la racine de son propre dépôt GitHub.
# - À chaque tag « v* » (ex. v0.2.0) : crée une Release avec les .exe à télécharger.
# - Manuellement (onglet Actions → « Run workflow ») : .exe disponibles en « artifact ».
name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sonotheque-windows
          path: dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
