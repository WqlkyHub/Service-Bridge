# Fabrique l'installateur Windows de FoleyBox (.exe). Le code est dans le dossier « sonotheque », l'ancien nom de l'appli.
# - Manuellement (onglet Actions → « Run workflow ») : les .exe sont disponibles en « Artifacts ».
# - À chaque tag « foleybox-v* » (ex. foleybox-v0.4.0) : crée une Release avec les .exe à télécharger.
name: "FoleyBox : installateur Windows"

on:
  push:
    tags: ['foleybox-v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: sonotheque

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sonotheque/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: foleybox-windows
          path: sonotheque/dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/foleybox-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FoleyBox ${{ github.ref_name }}
          files: sonotheque/dist/*.exe
